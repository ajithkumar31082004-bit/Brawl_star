global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'battleverse-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']
        labels:
          app: 'battleverse-api'
          env: 'production'

  - job_name: 'battleverse-node'
    static_configs:
      - targets: ['node-exporter:9100']
