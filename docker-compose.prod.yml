version: '3.8'

services:
  # 1. Frontend SPA Container (Nginx Alpine)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: battleverse-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    networks:
      - battleverse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Node.js Express REST & WebSocket Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: battleverse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-battleverse_db}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - SNS_TOPIC_ARN=${SNS_TOPIC_ARN}
      - JWT_SECRET=${JWT_SECRET:-battleverse_prod_secret_key_2026}
    networks:
      - battleverse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  battleverse-net:
    driver: bridge
