name: BATTLEVERSE CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ==========================================
  # JOB 1: Test & Build Frontend
  # ==========================================
  frontend-build:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc -b

      - name: Build Frontend Application
        run: npm run build

  # ==========================================
  # JOB 2: SonarQube Code Quality Analysis
  # ==========================================
  sonarqube-analysis:
    name: SonarQube Static Code Analysis
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

  # ==========================================
  # JOB 3: Trivy Security Vulnerability Scan
  # ==========================================
  trivy-security-scan:
    name: Trivy Vulnerability & Secret Scanner
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # JOB 4: Docker Image Build & ECR Push
  # ==========================================
  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: [trivy-security-scan]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: battleverse-frontend:latest

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: battleverse-backend:latest

      # ntfy Push Notification on Successful Build & Scan
      - name: Send ntfy Build Alert
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -H "Title: BATTLEVERSE CI/CD Pipeline" \
               -H "Priority: 4" \
               -H "Tags: rocket,shield" \
               -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN || 'tk_cx9g8tbmtkf3f4nowup4h1gixdbog' }}" \
               -d "GitHub Actions Build finished with status: $STATUS for branch ${{ github.ref_name }}" \
               https://ntfy.sh/battleverse-arena-alerts
